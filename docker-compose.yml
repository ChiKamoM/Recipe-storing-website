services:
  postgres:
    image: postgres:latest
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: justmondlisok
      POSTGRES_DB: recipe-site
    volumes:
      - postgres-data:/var/lib/postgresql
    ports:
     - "5431:5432"
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    env_file:
      - .env
    depends_on:
      - postgres

volumes:
  postgres-data:

