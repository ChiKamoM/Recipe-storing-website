apiVersion: v1
kind: ConfigMap
metadata:
  name: database-secret
  labels:
    app: database
data:
  POSTGRES_DB: recipe-site
  POSTGRES_PASSWORD: justmondlisok
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: database
spec:
  replicas: 1
  selector:
    matchLabels:
      app: database
  template:
    metadata:
      labels:
        app: database
    spec:
      containers:
        - name: database
          ports:
            - containerPort: 5432
          envFrom:
            - configMapRef:
                name: database-secret
          image: postgres:18
          imagePullPolicy: "IfNotPresent"
---
apiVersion: v1
kind: Service
metadata:
  name: database-nodeport
spec:
  selector:
    app: database
  ports:
    - protocol: TCP
      port: 5432
      targetPort: 5432
